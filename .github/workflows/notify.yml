name: Garden Daily Notification

on:
  schedule:
    - cron: '0 7 * * *'   # Every day at 07:00 UTC (09:00 Barcelona summer / 08:00 winter)
  workflow_dispatch:        # Allow manual trigger from GitHub Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-auth google-api-python-client

      - name: Debug secrets
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          echo "GDRIVE_CREDENTIALS length: ${#GDRIVE_CREDENTIALS}"
          echo "First 10 chars: ${GDRIVE_CREDENTIALS:0:10}"

      - name: Run notification script
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO:          ${{ secrets.NOTIFY_TO }}
          GDRIVE_FOLDER_ID:   ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: python notify.py
